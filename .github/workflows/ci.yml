name: CI — Packages

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "packages/**/src/**"
      - "packages/**/package.json"
      - "packages/**/*.json"
      - "turbo.json"
      - "biome.jsonc"
      - "bun.lock"
  push:
    branches: [dev]
    paths:
      - "packages/**/src/**"
      - "packages/**/package.json"
      - "packages/**/*.json"
      - "turbo.json"
      - "biome.jsonc"
      - "bun.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # ── Attention Requester ────────────────────────────────────────────
  lint-attention-requester:
    name: "Lint — attention-requester"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo lint --filter=@headless-uai/attention-requester

  check-attention-requester:
    name: "Type Check — attention-requester"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo check --filter=@headless-uai/attention-requester

  test-attention-requester:
    name: "Test + Coverage — attention-requester"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo test:coverage --filter=@headless-uai/attention-requester

  build-attention-requester:
    name: "Build — attention-requester"
    runs-on: ubuntu-latest
    needs:
      [
        lint-attention-requester,
        check-attention-requester,
        test-attention-requester,
      ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo build --filter=@headless-uai/attention-requester

  # ── Movable ────────────────────────────────────────────────────────
  lint-movable:
    name: "Lint — movable"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo lint --filter=@headless-uai/movable

  check-movable:
    name: "Type Check — movable"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo check --filter=@headless-uai/movable

  test-movable:
    name: "Test + Coverage — movable"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo test:coverage --filter=@headless-uai/movable

  build-movable:
    name: "Build — movable"
    runs-on: ubuntu-latest
    needs: [lint-movable, check-movable, test-movable]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo build --filter=@headless-uai/movable

  # ── Size Limit (push to dev) ───────────────────────────────────────
  size:
    name: Size Limit
    runs-on: ubuntu-latest
    needs: [build-attention-requester, build-movable]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo build --filter='./packages/*'

      - run: bunx turbo size --filter='./packages/*'

  # ── Size Limit PR Comment (per package) ────────────────────────────
  size-pr:
    name: "Size Limit (${{ matrix.package }})"
    runs-on: ubuntu-latest
    needs: [build-attention-requester, build-movable]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        include:
          - package: attention-requester
            path: packages/attention-requester
          - package: movable
            path: packages/movable
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - name: "Size: PR branch"
        run: |
          cd ${{ matrix.path }}
          bun run build
          bunx size-limit --json > /tmp/size-pr.json
          cat /tmp/size-pr.json

      - name: "Size: base branch"
        id: size-base
        continue-on-error: true
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git checkout -f ${{ github.base_ref }}
          bun install --frozen-lockfile
          cd ${{ matrix.path }}
          bun run build
          bunx size-limit --json > /tmp/size-base.json
          cat /tmp/size-base.json

      - name: Compare & comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = JSON.parse(fs.readFileSync('/tmp/size-pr.json', 'utf8'));
            const baseExists = '${{ steps.size-base.outcome }}' === 'success';
            const base = baseExists
              ? JSON.parse(fs.readFileSync('/tmp/size-base.json', 'utf8'))
              : null;

            const fmt = (b) => b < 1024 ? `${b} B` : `${(b / 1024).toFixed(2)} KB`;
            const pct = (a, b) => b === 0 ? '—' : `${((a - b) / b * 100).toFixed(1)}%`;

            let rows = '';
            for (let i = 0; i < pr.length; i++) {
              const p = pr[i];
              if (base) {
                const b = base[i] || { size: 0 };
                const diff = p.size - b.size;
                const sign = diff > 0 ? '+' : '';
                rows += `| ${{ matrix.package }} | ${fmt(b.size)} | ${fmt(p.size)} | ${sign}${fmt(diff)} (${sign}${pct(p.size, b.size)}) | ${p.passed ? '✅' : '🔴'} |\n`;
              } else {
                rows += `| ${{ matrix.package }} | — | ${fmt(p.size)} | — | ${p.passed ? '✅' : '🔴'} |\n`;
              }
            }

            const note = base ? '' : '\n\n> ⚠️ Base branch build failed — showing PR size only.\n';
            const body = `### 📦 Size Limit — \`${{ matrix.package }}\`\n\n` +
              `| Package | Base | PR | Diff | Status |\n` +
              `|---|---|---|---|---|\n` +
              rows + note +
              `\n<sub>Measured with <a href="https://github.com/ai/size-limit">size-limit</a></sub>`;

            const marker = `<!-- size-limit:${{ matrix.package }} -->`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            const commentBody = marker + '\n' + body;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

  # ── Security ───────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install osv-scanner
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan lockfile
        run: osv-scanner --config=osv-scanner.toml --lockfile=bun.lock
