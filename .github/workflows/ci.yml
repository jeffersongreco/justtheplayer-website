name: CI — Packages

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "packages/**"
      - "turbo.json"
      - "biome.jsonc"
      - "bun.lock"
  push:
    branches: [dev]
    paths:
      - "packages/**"
      - "turbo.json"
      - "biome.jsonc"
      - "bun.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo lint --filter='./packages/*'

  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo check --filter='./packages/*'

  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo test:coverage --filter='./packages/*'

  size:
    name: Size Limit
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo build --filter='./packages/*'

      - run: bunx turbo size --filter='./packages/*'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, check, test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      - run: bunx turbo build --filter='./packages/*'
