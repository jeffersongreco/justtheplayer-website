# git-cliff configuration
# Run: git cliff --config cliff.toml --include-path "packages/attention-requester/**" -o packages/attention-requester/CHANGELOG.md

[changelog]
header = "# Changelog\n\nAll notable changes to this package.\n"
body = """
{%- macro remote_url() -%}
  https://github.com/nicholasgalante1997/just-the-player-website
{%- endmacro -%}

{% if version -%}
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^refactor", group = "Refactor" },
  { message = "^perf", group = "Performance" },
  { message = "^a11y", group = "Accessibility" },
  { message = "^test", group = "Testing" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Chore", skip = true },
]
filter_commits = false
tag_pattern = ".*@.*"
